<body><img src="../Icon.png" width="116" height="116" alt="带快进符号的小鸭子"><h1>speedduck</h1><p class="intro">让网页播放器，跟上你的速度。</p>
<p class="state-unknown">前往 Safari 设置，启用 speedduck 扩展。</p><p class="state-on">speedduck 已启用。打开视频网页，点工具栏的小鸭子即可调速。</p><p class="state-off">只差一步：在 Safari 的「扩展」中勾选 speedduck。</p>
