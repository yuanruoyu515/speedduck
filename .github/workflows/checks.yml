name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: Source and state tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: python3 scripts/check-project.py
      - run: npm test
      - name: Verify generated popup is current
        run: |
          python3 scripts/build-ui.py
          git diff --exit-code -- extension/popup.html extension/manifest.json
  safari:
    name: Safari unsigned build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/build.sh
      - name: Verify app and embedded extension
        run: |
          test -d build/Build/Products/Release/speedduck.app
          test -d 'build/Build/Products/Release/speedduck.app/Contents/PlugIns/speedduck Extension.appex'
